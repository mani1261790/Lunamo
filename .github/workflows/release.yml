name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Validate required release secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "Missing SPARKLE_PRIVATE_KEY" >&2; exit 1; }
          test -n "$CERTIFICATE_BASE64" || { echo "Missing DEVELOPER_ID_P12_BASE64" >&2; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing DEVELOPER_ID_P12_PASSWORD" >&2; exit 1; }
          test -n "$SIGNING_IDENTITY" || { echo "Missing DEVELOPER_ID_APPLICATION" >&2; exit 1; }
          test -n "$NOTARY_APPLE_ID" || { echo "Missing NOTARY_APPLE_ID" >&2; exit 1; }
          test -n "$NOTARY_APP_PASSWORD" || { echo "Missing NOTARY_APP_PASSWORD" >&2; exit 1; }
          test -n "$NOTARY_TEAM_ID" || { echo "Missing NOTARY_TEAM_ID" >&2; exit 1; }
      - name: Build pinned sidecar
        run: ./Tools/build-sidecar.sh
      - name: Verify all implemented gates
        run: ./Tools/verify-current-gates.sh
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/marimonative-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Configure notarization
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials lunamo-ci \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"
          echo "MARIMONATIVE_NOTARY_PROFILE=lunamo-ci" >> "$GITHUB_ENV"
      - name: Verify release prerequisites
        env:
          MARIMONATIVE_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: ./Tools/verify-release-prerequisites.sh
      - name: Build and sign release app
        env:
          MARIMONATIVE_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: ./Tools/build-release-app.sh
      - name: Measure hosted performance (reference only)
        id: performance
        continue-on-error: true
        run: |
          set -o pipefail
          ./Tools/measure-release-performance.py .build/release-artifacts/Lunamo.app 2>&1 | tee .build/release-artifacts/HostedPerformance.log
      - name: Notarize staple and verify
        run: ./Tools/notarize-release.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create and notarize DMG
        env:
          MARIMONATIVE_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          ./Tools/build-dmg.sh
          version=$(plutil -extract CFBundleShortVersionString raw -o - MarimoNative/Resources/Info.plist)
          ./Tools/notarize-dmg.sh ".build/release-artifacts/Lunamo-$version.dmg"
      - name: Verify installed DMG offline on fresh macOS runner
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw -o - MarimoNative/Resources/Info.plist)
          python3 Tools/verify-dmg-install.py ".build/release-artifacts/Lunamo-$version.dmg" --output .build/release-artifacts/InstalledAcceptance.json
      - name: Sign Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/sparkle-private-key"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          version=$(plutil -extract CFBundleShortVersionString raw -o - MarimoNative/Resources/Info.plist)
          SPARKLE_PRIVATE_KEY_FILE="$key" ./Tools/generate-update-feed.sh \
            ".build/release-artifacts/Lunamo-$version.dmg" "v$version"
      - name: Create pending manual verification checklist
        run: |
          .build/Sidecar/bin/python3 -I Tools/create-release-checklist.py \
            --artifact .build/release-artifacts/Lunamo-$(plutil -extract CFBundleShortVersionString raw -o - MarimoNative/Resources/Info.plist).dmg \
            --output .build/release-artifacts/ReleaseChecklist.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Lunamo-notarized
          path: |
            .build/release-artifacts/Lunamo-*.dmg
            .build/release-artifacts/updates-*/appcast.xml
            .build/release-artifacts/*.dmg.notarization.json
            .build/release-artifacts/notarization.json
            .build/release-artifacts/ReleaseChecklist.yml
            .build/release-artifacts/HostedPerformance.log
            .build/release-artifacts/InstalledAcceptance.json
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/marimonative-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/sparkle-private-key"
      - name: Record hosted performance result
        if: always()
        env:
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        run: |
          echo "Hosted performance (reference only): $PERFORMANCE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Publication requires a passing physical-Mac performance report bound to the final DMG SHA-256, plus the completed release checklist." >> "$GITHUB_STEP_SUMMARY"
