name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned sidecar
        run: ./Tools/build-sidecar.sh
      - name: Implemented gates
        run: ./Tools/verify-current-gates.sh
